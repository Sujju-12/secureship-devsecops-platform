name: SecureShip Signed Image Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: secureship-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish-sign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set lowercase image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push immutable SHA tag
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: app/Dockerfile
          push: true
          tags: ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.8.2
      - name: Sign image digest with GitHub OIDC identity
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"
      - name: Install Syft
        uses: anchore/sbom-action/download-syft@v0
      - name: Generate SBOM for published image
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: syft "$IMAGE@$DIGEST" -o cyclonedx-json=sbom.cdx.json
      - name: Upload release SBOM
        uses: actions/upload-artifact@v4
        with:
          name: release-sbom-${{ github.sha }}
          path: sbom.cdx.json
          if-no-files-found: error
