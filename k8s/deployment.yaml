apiVersion: apps/v1
kind: Deployment
metadata:
  name: secureship-demo
  namespace: secureship
  labels:
    app.kubernetes.io/name: secureship-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: secureship-demo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: secureship-demo
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          # Replace with the immutable tag/digest produced by the release workflow.
          image: ghcr.io/sujju-12/secureship-devsecops-platform:replace-with-sha-tag
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: secureship-demo
  namespace: secureship
spec:
  selector:
    app.kubernetes.io/name: secureship-demo
  ports:
    - name: http
      port: 80
      targetPort: http
  type: ClusterIP
