apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: secureship-disallow-latest
  annotations:
    policies.kyverno.io/title: Disallow latest image tag
    policies.kyverno.io/category: Supply Chain Security
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: disallow-latest-tag
      match:
        any:
          - resources:
              kinds: [Pod]
      validate:
        message: "Use an immutable image tag; the latest tag is not allowed."
        pattern:
          spec:
            containers:
              - image: "!*:latest"
